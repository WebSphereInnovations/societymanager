<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Society360 Cashier</title><link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet"><style>body{margin:0;background:#f5f7fb;font:14px Arial;color:#18223f;padding:30px}.wrap{max-width:1200px;margin:auto}.hero{background:#18244a;color:white;border-radius:22px;padding:26px}.tabs{margin:18px 0}.tabs button{padding:11px 16px;border:0;border-radius:9px;margin-right:8px}.box{background:white;border:1px solid #e5e8ef;border-radius:16px;padding:12px}</style></head><body><div class="wrap"><div class="hero"><small>CASH COLLECTION</small><h1>Society360 Cashier</h1><p id="who">Loading...</p></div><div class="tabs"><button onclick="bills()">Bills</button><button onclick="collection()">Collection</button><button onclick="logout()">Logout</button></div><div class="box" id="grid"></div></div><script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script><script>async function me(){let r=await fetch('/api/auth/me');if(!r.ok){location='/login.html';return}let x=await r.json();document.getElementById('who').textContent=x.session.displayName+' · '+x.session.roleCode}async function bills(){let r=await fetch('/api/cashier/bills');let x=await r.json();new Tabulator('#grid',{data:x,layout:'fitColumns',pagination:true,columns:[{title:'Bill',field:'bill_no',headerFilter:true},{title:'Month',field:'bill_month',headerFilter:true},{title:'Flat',field:'flat_no',headerFilter:true},{title:'Customer',field:'customer_name',headerFilter:true},{title:'Amount',field:'total_amount'},{title:'Paid',field:'paid_amount'},{title:'Balance',field:'balance'},{title:'Status',field:'status',headerFilter:true}]})}async function collection(){let r=await fetch('/api/cashier/collection');let x=await r.json();new Tabulator('#grid',{data:x,layout:'fitColumns',pagination:true,columns:[{title:'Payment',field:'payment_no',headerFilter:true},{title:'Date',field:'payment_date',headerFilter:true},{title:'Flat',field:'flat_no',headerFilter:true},{title:'Customer',field:'customer_name',headerFilter:true},{title:'Amount',field:'amount'},{title:'Mode',field:'payment_mode',headerFilter:true}]})}async function logout(){await fetch('/api/auth/logout',{method:'POST'});location='/login.html'}me();bills();</script></body></html>
