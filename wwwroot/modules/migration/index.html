<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="/css/support-assistant.css">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Society360 - Migration</title><script src="/js/i18n.js"></script>
<link rel="stylesheet" href="/css/site.css">
<style>
body{margin:0;background:#0b1020;color:#e8edf7;font-family:Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:40px auto;padding:0 20px}.card{background:#121a2b;border:1px solid #26324a;border-radius:18px;padding:24px;margin-bottom:18px}
h1{margin:0 0 8px}.muted{color:#94a3b8}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
input,button{border-radius:10px;padding:11px 14px;border:1px solid #34425d;background:#0d1526;color:#fff}
button{cursor:pointer;background:#6657d9;border-color:#6657d9}.danger{background:#334155}
table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:9px;border-bottom:1px solid #26324a;text-align:left;font-size:13px}
.badge{padding:5px 9px;border-radius:999px;background:#1e293b}.ok{background:#14532d}
</style></head>
<body><div style="position:fixed;right:18px;top:14px;z-index:1000"><select id="language-select" style="background:#0d1526;color:#fff;border:1px solid #34425d;border-radius:8px;padding:8px"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option><option value="gu">ગુજરાતી</option><option value="kn">ಕನ್ನಡ</option><option value="ta">தமிழ்</option></select></div><main class="wrap">
<div class="card"><h1>Migration Center</h1><div class="muted">Import old consumer / flat / wing / area / maintenance data without losing the original row information.</div></div>
<div class="card">
<div class="row"><input id="file" type="file" accept=".xlsx,.xls,.csv"><button onclick="preview()">Preview</button><button onclick="importData()">Import into selected society</button></div>
<p id="status" class="muted">Select an Excel file. Preview is safe and does not write master data.</p>
</div>
<div class="card"><div id="summary"></div><div style="overflow:auto"><table><thead><tr><th>Row</th><th>Wing</th><th>Unit</th><th>Type</th><th>Owner</th><th>Area</th><th>Maintenance</th></tr></thead><tbody id="grid"></tbody></table></div></div>
</main><script src="/modules/migration/migration.js"></script><script src="/js/support-assistant.js"></script></body></html>
