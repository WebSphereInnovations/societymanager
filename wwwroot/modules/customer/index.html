<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Society360 Customer</title><link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet"><script src="/js/i18n.js?v=20261005.01"></script><style>body{margin:0;background:#f5f7fb;color:#18223f;font:14px Arial;padding:35px}.wrap{max-width:1100px;margin:auto}.top{background:#18244a;color:white;border-radius:24px;padding:30px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:white;border:1px solid #e5e8ef;border-radius:16px;padding:18px}.card b{font-size:20px;display:block;margin-top:7px}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{padding:11px 16px;border:0;border-radius:10px;cursor:pointer}.form{background:white;padding:20px;border-radius:16px}.form input,.form textarea{display:block;width:100%;margin:8px 0;padding:10px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}.form button{padding:11px 18px;border:0;border-radius:9px;background:#6b5ce7;color:white}h1{margin:6px 0}.muted{opacity:.7}</style></head><body><div style="position:fixed;right:18px;top:14px;z-index:1000"><select id="language-select" style="background:#fff;color:#18223f;border:1px solid #ddd;border-radius:8px;padding:8px"></select></div><div class="wrap"><div class="top"><small>MY SOCIETY ACCOUNT</small><h1 id="name">Loading...</h1><div id="flat"></div></div><div class="grid"><div class="card">Customer Code<b id="code">—</b></div><div class="card">Phone<b id="phone">—</b></div><div class="card">Email<b id="email">—</b></div><div class="card">Relation<b id="relation">—</b></div></div><div class="tabs"><button onclick="show('bills')">My Bills</button><button onclick="show('complaints')">My Complaints</button><button onclick="show('new')">Raise Complaint</button><button onclick="logout()">Logout</button></div><div id="bills"></div><div id="complaints" style="display:none"></div><div id="new" style="display:none" class="form"><h3>Raise Complaint</h3><input id="cat" placeholder="Category"><input id="title" placeholder="Title"><textarea id="desc" placeholder="Describe your issue"></textarea><button onclick="raiseComplaint()">Submit Complaint</button></div></div><link rel="stylesheet" href="/css/support-assistant.css"><script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script><script>
async function get(u,o){let r=await fetch(u,o);if(r.status===401){location='/login.html';return null}return r.json()}function show(x){['bills','complaints','new'].forEach(id=>document.getElementById(id).style.display=id===x?'block':'none');if(x==='complaints')loadComplaints()}async function init(){let x=await get('/api/customer/me');if(!x)return;document.getElementById('name').textContent=x.full_name;document.getElementById('flat').textContent=x.flat_no+' · '+x.wing+' · '+x.building;document.getElementById('code').textContent=x.customer_code;document.getElementById('phone').textContent=x.phone||'—';document.getElementById('email').textContent=x.email||'—';document.getElementById('relation').textContent=x.relation_type;let b=await get('/api/customer/bills');new Tabulator('#bills',{data:b,layout:'fitColumns',pagination:true,columns:[{title:'Bill',field:'bill_no',headerFilter:true},{title:'Month',field:'bill_month'},{title:'Amount',field:'total_amount'},{title:'Paid',field:'paid_amount'},{title:'Balance',field:'balance'},{title:'Due',field:'due_date'},{title:'Status',field:'status',headerFilter:true}]})}async function loadComplaints(){let x=await get('/api/customer/complaints');new Tabulator('#complaints',{data:x,layout:'fitColumns',pagination:true,columns:[{title:'Complaint',field:'complaint_no',headerFilter:true},{title:'Category',field:'category',headerFilter:true},{title:'Title',field:'title',headerFilter:true},{title:'Priority',field:'priority',headerFilter:true},{title:'Status',field:'status',headerFilter:true},{title:'Created',field:'created_at'}]})}async function raiseComplaint(){let r=await fetch('/api/customer/complaints',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:cat.value,title:title.value,description:desc.value,priority:'Normal'})});if(r.ok){alert('Complaint submitted successfully');show('complaints')}else alert('Unable to submit complaint')}async function logout(){await fetch('/api/auth/logout',{method:'POST'});location='/login.html'}init();</script><script src="/js/support-assistant.js"></script></body></html>
